  .axis-label { font-size: 12px; fill: #334155; }
  .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
  .curve-flint { fill: none; stroke: #d97706; stroke-width: 3.5; }
