<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#090D12"/><text x="800" y="108" fill="#F1F1EB" font-size="43" font-family="Georgia, serif" text-anchor="middle" font-weight="400">Update the history. Reuse the continuation.</text><text x="800" y="174" fill="#B5C0CD" font-size="27" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">ngram-mod · 4-token context · up to 4 draft tokens</text><g opacity="1" transform=""><text x="800" y="239" fill="#B5C0CD" font-size="27" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">Example indices: n = 4, i_last = 0, cur_len = 8</text><text x="245" y="321" fill="#B5C0CD" font-size="27" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">before</text><text x="800" y="321" fill="#F1F1EB" font-size="29" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">if (i_last + 32 &lt; cur_len)</text><g opacity="1" transform=""><text x="1246" y="321" fill="#EC8D96" font-size="27" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">32 &lt; 8</text><path d="M 1360 302 l 20 20 M 1380 302 l -20 20" stroke="#EC8D96" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="56.569 56.569" stroke-dashoffset="0" opacity="1"/></g><text x="245" y="408" fill="#63E2C4" font-size="27" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">patch</text><text x="800" y="408" fill="#63E2C4" font-size="29" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">if (i_last &lt; cur_len - n)</text><g opacity="1" transform=""><text x="1246" y="408" fill="#63E2C4" font-size="27" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">0 &lt; 4</text><path d="M 1358 398 l 9 10 l 20 -25" stroke="#63E2C4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="45.469 45.469" stroke-dashoffset="0" opacity="1"/></g><path d="M 160 453 L 1440 453" stroke="#233242" stroke-width="1.5" fill="none" stroke-linecap="round"/></g><g opacity="1" transform=""><rect x="322" y="529" width="116" height="74" rx="4" stroke="#53677A" fill="#090D12" stroke-width="2.5"/><text x="380" y="576" fill="#53677A" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h0</text></g><g opacity="1" transform=""><rect x="442" y="529" width="116" height="74" rx="4" stroke="#53677A" fill="#090D12" stroke-width="2.5"/><text x="500" y="576" fill="#53677A" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h1</text></g><g opacity="1" transform=""><rect x="562" y="529" width="116" height="74" rx="4" stroke="#53677A" fill="#090D12" stroke-width="2.5"/><text x="620" y="576" fill="#53677A" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h2</text></g><g opacity="1" transform=""><rect x="682" y="529" width="116" height="74" rx="4" stroke="#63E2C4" fill="#090D12" stroke-width="2.5"/><text x="740" y="576" fill="#63E2C4" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h3</text></g><g opacity="1" transform=""><rect x="802" y="529" width="116" height="74" rx="4" stroke="#63E2C4" fill="#090D12" stroke-width="2.5"/><text x="860" y="576" fill="#63E2C4" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h4</text></g><g opacity="1" transform=""><rect x="922" y="529" width="116" height="74" rx="4" stroke="#63E2C4" fill="#090D12" stroke-width="2.5"/><text x="980" y="576" fill="#63E2C4" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h5</text></g><g opacity="1" transform=""><rect x="1042" y="529" width="116" height="74" rx="4" stroke="#63E2C4" fill="#090D12" stroke-width="2.5"/><text x="1100" y="576" fill="#63E2C4" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h6</text></g><g opacity="1" transform=""><rect x="1162" y="529" width="116" height="74" rx="4" stroke="#B9A2ED" fill="#090D12" stroke-width="2.5"/><text x="1220" y="576" fill="#B9A2ED" font-size="32" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">h7</text></g><g opacity="1" transform=""><rect x="673" y="516" width="494" height="101" rx="6" stroke="#63E2C4" fill="none" stroke-width="2"/><text x="920" y="660" fill="#63E2C4" font-size="27" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">i = 3</text><text x="920" y="494" fill="#63E2C4" font-size="27" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">context</text><text x="1220" y="660" fill="#B9A2ED" font-size="27" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">next token</text><text x="800" y="738" fill="#F1F1EB" font-size="29" font-family="Menlo, monospace" text-anchor="middle" font-weight="400">mod.add(prompt_tgt.data() + i);</text></g><g opacity="0" transform=""><text x="800" y="737" fill="#B5C0CD" font-size="29" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">Add each available context and its next token.</text></g><text x="800" y="824" fill="#B5C0CD" font-size="25" font-family="Avenir Next, sans-serif" text-anchor="middle" font-weight="400">Actual patch and settings; token positions and acceptance are examples.</text></svg>